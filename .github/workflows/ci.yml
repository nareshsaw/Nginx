name: nginx-lab CI

on:
  push:
  pull_request:

jobs:
  docker-compose:
    name: NGINX reverse proxy (Docker Compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate TLS certificate
        run: ./scripts/gen-certs.sh
      - name: Start stack
        run: docker compose -f docker/docker-compose.yml up -d
      - name: Validate NGINX config
        run: docker compose -f docker/docker-compose.yml exec -T nginx nginx -t
      - name: Smoke tests
        run: sleep 3 && ./scripts/test-lb.sh
      - name: NGINX logs
        if: always()
        run: docker compose -f docker/docker-compose.yml logs nginx

  kubernetes-ingress:
    name: ingress-nginx on Kubernetes (kind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: nginx-lab
          config: k8s/kind-config.yaml
      - name: Install ingress-nginx
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.3/deploy/static/provider/kind/deploy.yaml
          kubectl wait -n ingress-nginx --for=condition=complete job --all --timeout=180s || true
          kubectl wait -n ingress-nginx --for=condition=ready pod -l app.kubernetes.io/component=controller --timeout=180s
      - name: Deploy apps, TLS secret and Ingress
        run: |
          ./scripts/gen-certs.sh
          kubectl apply -f k8s/apps.yaml
          kubectl create secret tls lab-tls -n nginx-lab --cert=certs/lab.crt --key=certs/lab.key
          for i in 1 2 3 4 5 6; do kubectl apply -f k8s/ingress.yaml && break; echo "webhook not ready, retrying"; sleep 10; done
          kubectl wait -n nginx-lab --for=condition=available deploy --all --timeout=120s
      - name: Test routing
        run: |
          sleep 5
          curl -sk --resolve lab.local:443:127.0.0.1 https://lab.local/app1 | grep "app1"
          curl -sk --resolve lab.local:443:127.0.0.1 https://lab.local/app2 | grep "app2"
          curl -s -o /dev/null -w "%{http_code}\n" --resolve lab.local:80:127.0.0.1 http://lab.local/app1
