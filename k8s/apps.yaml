apiVersion: v1
kind: Namespace
metadata:
  name: nginx-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1
  namespace: nginx-lab
spec:
  replicas: 2
  selector:
    matchLabels: { app: app1 }
  template:
    metadata:
      labels: { app: app1 }
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0
          args: ["-text=hello from app1"]
          ports: [{ containerPort: 5678 }]
          readinessProbe:
            httpGet: { path: /, port: 5678 }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2
  namespace: nginx-lab
spec:
  replicas: 2
  selector:
    matchLabels: { app: app2 }
  template:
    metadata:
      labels: { app: app2 }
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0
          args: ["-text=hello from app2"]
          ports: [{ containerPort: 5678 }]
          readinessProbe:
            httpGet: { path: /, port: 5678 }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: app1
  namespace: nginx-lab
spec:
  selector: { app: app1 }
  ports: [{ port: 80, targetPort: 5678 }]
---
apiVersion: v1
kind: Service
metadata:
  name: app2
  namespace: nginx-lab
spec:
  selector: { app: app2 }
  ports: [{ port: 80, targetPort: 5678 }]
