# ---- Load balancing --------------------------------------------------------
upstream backend {
    least_conn;                                          # send to the least-busy server
    server app1:5678 max_fails=3 fail_timeout=10s;       # passive health checks
    server app2:5678 max_fails=3 fail_timeout=10s;
    keepalive 16;                                        # reuse upstream connections
}

# ---- Rate limiting: 10 requests/second per client IP -----------------------
limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;

# ---- HTTP: redirect everything to HTTPS ------------------------------------
server {
    listen 80;
    server_name lab.local localhost;
    return 301 https://$host:8443$request_uri;           # 8443 = port mapped in docker-compose
}

# ---- HTTPS reverse proxy ---------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name lab.local localhost;

    ssl_certificate     /etc/nginx/certs/lab.crt;
    ssl_certificate_key /etc/nginx/certs/lab.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff"          always;
    add_header X-Frame-Options           "DENY"             always;
    # Shows which backend served the request (for the load-balancing demo)
    add_header X-Upstream                $upstream_addr     always;

    location / {
        limit_req zone=perip burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout    10s;
        proxy_next_upstream   error timeout http_502 http_503;   # retry on the other backend
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location = /nginx_status {
        stub_status;
        allow 127.0.0.1;
        deny  all;
    }
}
